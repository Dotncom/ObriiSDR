plugins {
    id 'com.android.application'
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}

def releaseKeystore = System.getenv('FOBOSAPP_ANDROID_KEYSTORE')
def releaseKeyAlias = System.getenv('FOBOSAPP_ANDROID_KEY_ALIAS')
def releaseStorePassword = System.getenv('FOBOSAPP_ANDROID_KEYSTORE_PASSWORD')
def releaseKeyPassword = System.getenv('FOBOSAPP_ANDROID_KEY_PASSWORD')
def hasReleaseSigning = releaseKeystore && releaseKeyAlias && releaseStorePassword && releaseKeyPassword

android {
    namespace 'com.fobosapp.networkclient'
    compileSdk 35
    ndkVersion '27.0.12077973'

    defaultConfig {
        applicationId 'com.fobosapp.networkclient'
        minSdk 26
        targetSdk 35
        versionCode 14
        versionName '8.0.0-android-preview'

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseKeystore)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.preview'
        }
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
        }
    }
}
